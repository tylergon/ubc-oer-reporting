[tools]
node = "22"
python = "3.14"
uv = "latest"

[env]
# Auto-create and activate a venv for the crawler
_.python.venv = { path = "crawler/.venv", create = true }

# ---------- Install ----------

[tasks.install]
description = "Install all dependencies"
depends = ["web:install", "crawler:install"]

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "npm install"

[tasks."crawler:install"]
description = "Install crawler dependencies"
dir = "crawler"
run = "uv sync"

# ---------- Web ----------

[tasks."web:dev"]
description = "Start the SvelteKit dev server"
dir = "web"
run = "npm run dev"

[tasks."web:build"]
description = "Production build of the website"
dir = "web"
run = "npm run build"

[tasks."web:check"]
description = "Type-check TypeScript and Svelte"
dir = "web"
run = "npm run check"

[tasks."web:format"]
description = "Format the website with Prettier"
dir = "web"
run = "npx prettier --write ."

[tasks."web:lint"]
description = "Check formatting without changing files"
dir = "web"
run = "npx prettier --check ."

# ---------- Crawler ----------

[tasks."crawler:all"]
description = "Runs the full crawling pipeline"
depends = ["crawler:crawl", "crawler:filter"]

[tasks."crawler:crawl"]
description = "Scrape the academic calendar"
dir = "crawler"
run = "uv run scrapy crawl academic-calendar"

[tasks."crawler:filter"]
description = "Clean scraped names and filter unneeded data"
dir = "crawler"
run = "uv run filter_outputs.py"